license:
  status: Apache-2.0
  redistribution: allowed
  source_files_copied: true

usage:
  type: direct
  adapt_required: false
  role: security review before adopting or installing third-party Skills

runtime_dependency:
  cli: skillspector
  package_version: 2.12.0
  python: ">=3.12,<3.15"
  install_options:
    preferred: "uv tool install git+https://github.com/NVIDIA/skillspector.git"
    static_only_supported: true
    mcp_extra_required: false

review_notes:
  - Static score is evidence, not the final verdict.
  - Target Skill scripts must not be executed during review.
  - Manual semantic review remains required for sensitive findings.
  - Optional LLM scanning may use external providers and credentials; default adoption should use --no-llm first.
  - Scanner itself can ingest Git repos/URLs/archives and makes network requests for remote inputs.
