adoption:
  use_policy: adapted
  adapted_in:
    repo: Guluguluxxx/my-ai-skills
    path: skills/adapted/personal-video-batch-editing
  retained:
    - ffmpeg-first deterministic rendering
    - short-sample validation before large batch rendering
    - audio/video duration and sync checks
    - avoid repeated re-encoding
    - browser/storyboard preview as an optional review surface
  removed_from_default:
    - automatic Whisper/FunASR installation
    - automatic model downloads
    - mandatory vision API analysis
    - automatic reference-video downloading
    - Vlog-specific narrative ratios and fixed pacing heuristics
    - shell=True command construction

risk:
  level: medium
  findings:
    - upstream recommends automatic pip installation and large ASR model downloads
    - optional vision analysis uploads extracted local frames to an external API
    - optional reference research may download videos using yt-dlp
    - example code includes subprocess shell=True
    - ffmpeg examples use overwrite mode and create many derived files
    - frontmatter still declares version 1.1.0 while later commits add substantial workflow changes

sync_policy:
  review_diff_before_update: true
  do_not_import_upstream_ai_or_cloud_defaults_automatically: true
