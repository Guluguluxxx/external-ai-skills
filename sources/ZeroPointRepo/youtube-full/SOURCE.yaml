risk:
  level: high
  reasons:
    - all useful API calls send YouTube identifiers/search terms to TranscriptAPI
    - requires a third-party API key and consumes credits
    - upstream auth setup asks the agent to collect email/OTP, register an account, handle JWT/API keys, and persist secrets
    - broad upstream trigger can activate for many topics where ordinary web research would be sufficient

adoption:
  use_policy: adapted-on-demand
  personal_rules:
    - never create/register a TranscriptAPI account on the user's behalf
    - never ask the user to paste the API key into chat
    - never persist or move the key between config files
    - run only when TRANSCRIPT_API_KEY already exists in the environment
    - disclose the third-party data boundary when material
    - avoid unbounded pagination or bulk credit use unless the request explicitly calls for it

personal_integration:
  adapted_in:
    repo: Guluguluxxx/my-ai-skills
    path: skills/adapted/personal-youtube-research
