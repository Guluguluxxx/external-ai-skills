    path: skills/adapted/personal-ue5-editor-control

risk:
  level: high
  findings:
    - plugin exposes editor mutation over HTTP on port 58080
    - reviewed execute handler does not perform authentication checks
    - CORS response allows origin "*"
    - generic reflection includes call_function, modify_array_property, and execute_python
    - installer removes an existing Plugins/UE5AIAssistant directory before extraction
    - installer downloads a release ZIP without checksum/signature verification in the reviewed script
    - save_all, delete, settings writes, reflection writes, and arbitrary Python can make broad persistent changes
  documentation_drift:
    - latest commit/AGENTS.md lists 67 commands while selected SKILL.md metadata still says 65

sync_policy:
  review_diff_before_update: true
  require_three_way_analysis: true
  require_sandbox_retest_after_plugin_or_command-surface_change: true
