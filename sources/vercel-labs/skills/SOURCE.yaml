id: vercel-labs/skills
mode: pointer
category: tooling/skill-manager

upstream:
  repo: vercel-labs/skills
  url: https://github.com/vercel-labs/skills
  branch: main
  synced_commit: 3694740352eeef5cdd689af694c485f1ff62eec3
  synced_at: 2026-09-30

license:
  type: MIT
  redistribution: permitted
  mirror_reason: executable package manager; source mirroring is unnecessary

adoption:
  use_policy: tool-only
  role:
    - list candidate Skills
    - install selected reviewed Skills
    - temporarily use low-frequency Skills
    - list/remove/update installed Skills
  notes:
    - private GitHub installs reuse configured Git/gh/SSH authentication
    - reviewed README states the tool does not execute gh auth token or read the stored GitHub CLI credential into its Node process
    - use does not permanently install the selected Skill
    - update should not replace the personal Base/New/Mine review policy

risk:
  level: medium
  notes:
    - clones/downloads external repositories
    - writes Skill files/symlinks into agent directories
    - update/remove can change installed Skill state
    - installation still requires prior lifecycle review

sync_policy:
  pin_tool_review_to_commit: true
  do_not_auto-update_adapted_skills: true


deep_review_2026_09_30:
  package:
    name: skills
    reviewed_version: 1.7.0
    node_engine: ">=22.20.0"
  telemetry:
    enabled_by_default: true
    endpoint: https://add-skill.vercel.sh/t
    audit_endpoint: https://add-skill.vercel.sh/audit
    disable_env:
      - DO_NOT_TRACK
      - DISABLE_TELEMETRY
    policy: disable by default in personal lifecycle operations
  agent_behavior:
    - add auto-enables non-interactive yes mode when an AI agent is detected
    - remove auto-enables non-interactive yes mode when an AI agent is detected
    - use materializes the selected Skill in a temporary directory and injects its SKILL.md into the launched/generated agent prompt
  safety_implications:
    - temporary use is not a security bypass; review still precedes use
    - remove/update are mutation operations and must stay under lifecycle backup/authorization rules
    - update must not be used on adapted Skills as a substitute for Base/New/Mine review
    - avoid unpinned npx latest for canonical lifecycle operations
  preferred_invocation:
    package: skills@1.7.0
    persistence: on-demand-npx
    telemetry: disabled
