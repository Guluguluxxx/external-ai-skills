license:
  status: no-license-file-found
  redistribution: not-assumed
  source_files_copied: false

adoption:
  use_policy: research-project-local
  install_now: false
  reasons:
    - Material workflow is highly relevant to UE technical-art work.
    - Actual execution depends on the separate MaterialSemanticBridge Fab plugin.
    - Repository does not expose a root LICENSE in the reviewed state.
    - UE/version/plugin compatibility should be verified in a real UE5.7 test project before adoption.

material_workflow:
  strengths:
    - material requirements -> materialdsl -> validate/normalize -> preview -> repair -> import
    - schema discovery before guessing node properties/pins
    - preview image or frame review before final import
    - supports MaterialExpressionCustom within the documented support surface
  boundaries:
    - not for Niagara, Blueprint, Sequencer, or general Unreal C++
    - not for arbitrary HLSL outside supported MaterialExpressionCustom usage
    - normalization may rewrite the DSL into canonical form
    - import writes Unreal assets
    - optional build path can invoke Unreal build tooling

personal_fit:
  preserve:
    - Blueprint-first project policy
    - visual validation remains human-dependent when preview is insufficient
    - existing Custom-node-only HLSL edits should stay direct HLSL when graph structure does not need changes
  defer_until_tested:
    - plugin installation
    - project-local skill installation
    - any automated material import into production assets

sync_policy:
  review_diff_before_update: true
  require_ue57_plugin_compatibility_test_before_adoption: true
